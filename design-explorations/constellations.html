<html lang="en">
<head>

<title>Five constellations for Leah</title>
<style>
*{box-sizing:border-box}body{margin:0;color:var(--foreground,#eee);font-family:var(--font-sans,system-ui,sans-serif)}button{font:inherit;cursor:pointer}.choices{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:15px}.choices button{background:var(--card,#28282b);color:var(--foreground,#eee);border:1px solid var(--border,#535359);border-radius:7px;padding:12px 7px;text-align:left;font-size:12px;line-height:1.5}.choices button[aria-pressed=true]{outline:2px solid var(--foreground,#eee);outline-offset:1px}.swatch{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}.details{display:flex;align-items:start;justify-content:space-between;gap:16px;margin-bottom:16px}.details h2{font-size:18px;margin:0 0 5px}.details p{font-size:13px;line-height:1.55;color:var(--muted-foreground,#aaa);max-width:62ch;margin:0}.size{white-space:nowrap;display:flex;gap:5px}.size button{font-size:12px;color:var(--foreground,#eee);background:var(--card,#28282b);border:1px solid var(--border,#555);border-radius:4px;padding:7px}.size button[aria-pressed=true]{border-color:var(--foreground,#eee)}button:focus-visible{outline:3px solid #baabde;outline-offset:4px}.frame{max-width:1100px;margin:auto}.frame.phone{max-width:390px}.scene{--sky:#24223c;--ink:#f6f0ff;--soft:#bfb2d4;--line:#6e6088;--star:#dfbaf1;background:var(--sky);color:var(--ink);border-radius:12px;padding:25px 30px 22px;overflow:hidden;font-family:'Trebuchet MS',sans-serif;isolation:isolate;position:relative}.scene a{color:inherit;text-decoration:none}.scene a:focus-visible{outline:2px solid var(--star);outline-offset:6px}.scene a:hover{text-decoration:underline;text-underline-offset:5px}.top{display:flex;align-items:center;justify-content:space-between;font-size:12px;position:relative;z-index:3}.wordmark{font:22px Georgia,serif}.top .where{color:var(--soft);font-size:11px}.space{height:470px;position:relative}.geometry,.dust{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.geometry{overflow:visible}.geometry path,.geometry ellipse,.geometry circle{fill:none;stroke:var(--line);stroke-width:.85;vector-effect:non-scaling-stroke}.geometry .secondary{opacity:.45}.geometry .bright{stroke:var(--star);opacity:.6}.dust i{position:absolute;width:2px;height:2px;background:var(--star);border-radius:50%;opacity:.45}.dust i.cross{width:7px;height:1px;opacity:.7}.dust i.cross:after{content:'';position:absolute;left:3px;top:-3px;height:7px;width:1px;background:var(--star)}.intro{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);text-align:center;width:270px;z-index:2}.intro h1{font-family:Georgia,serif;font-size:76px;font-weight:400;letter-spacing:-3px;line-height:1;margin:0 0 18px}.intro p{font:15px/1.75 Georgia,serif;color:var(--soft);max-width:28ch;margin:0 auto}.destination{position:absolute;z-index:3;text-align:center;padding:12px 10px;transform:translate(-50%,-50%);min-width:86px;font:16px Georgia,serif}.destination:before{content:'';display:block;width:7px;height:7px;border-radius:50%;background:var(--star);margin:0 auto 13px;box-shadow:0 0 0 5px color-mix(in srgb,var(--star) 7%,transparent);transition:box-shadow .2s,transform .2s}.destination:hover:before,.destination:focus-visible:before{box-shadow:0 0 0 10px color-mix(in srgb,var(--star) 15%,transparent),0 0 18px var(--star);transform:scale(1.25)}.destination small{display:block;color:var(--soft);font:10px 'Trebuchet MS',sans-serif;margin-top:7px}.gallery{left:29%;top:18%}.tools{left:81%;top:55%}.projects{left:24%;top:84%}.bottom{display:flex;justify-content:space-between;align-items:center;gap:20px;font-size:11px;position:relative;z-index:3}.socials{display:flex;gap:22px}.signature{color:var(--soft)}.explain{font-size:12px;color:var(--muted-foreground,#aaa);line-height:1.6;margin:12px 0}.blue{--sky:#122d43;--ink:#eff8ff;--soft:#acc8db;--line:#527d98;--star:#b5e5fb}.blue .intro{left:27%;top:48%;text-align:left;width:245px}.blue .intro h1{font-family:Palatino,'Palatino Linotype',serif;font-size:78px}.blue .intro p{margin:0;max-width:23ch}.blue .gallery{left:68%;top:16%}.blue .tools{left:84%;top:50%}.blue .projects{left:69%;top:85%}.blue .space{height:470px}.rose{--sky:#332534;--ink:#fff0f3;--soft:#d8b9cb;--line:#8b647c;--star:#f0c0d6}.rose .intro h1{font-style:italic;font-size:82px}.eclipse{position:absolute;width:310px;height:310px;border-radius:50%;left:50%;top:47%;transform:translate(-50%,-50%);background:#2b2130;box-shadow:-13px -7px 0 -10px #f0c0d6,-26px -14px 40px -30px #f0c0d6}.rose .gallery{left:21%;top:27%}.rose .tools{left:81%;top:64%}.rose .projects{left:32%;top:86%}.atlas{--sky:#181f2b;--ink:#f2f4fa;--soft:#b4bed0;--line:#65728e;--star:#e4e9ff}.atlas .intro{top:25%;left:50%;width:330px}.atlas .intro h1{font-family:Baskerville,'Times New Roman',serif;font-size:70px;letter-spacing:0}.atlas .intro p{font-size:14px;max-width:34ch}.atlas .gallery{left:20%;top:57%}.atlas .tools{left:77%;top:62%}.atlas .projects{left:49%;top:87%}.atlas .destination:before{border-radius:0;transform:rotate(45deg);width:6px;height:6px}.tidal{--sky:#153b3c;--ink:#eaf8f3;--soft:#b0d2c9;--line:#527f78;--star:#c5ebe0}.tidal .intro{left:56%;top:44%;text-align:left;width:250px}.tidal .intro h1{font-family:Palatino,'Palatino Linotype',serif;font-size:78px}.tidal .intro p{margin:0}.tidal .gallery{left:20%;top:27%}.tidal .tools{left:84%;top:66%}.tidal .projects{left:34%;top:86%}.tidal .geometry .bright{stroke-width:1.5}
@media(max-width:550px){.choices{grid-template-columns:repeat(3,1fr)}.details{flex-direction:column}.scene{padding:22px 18px}.space{height:480px}.intro{width:210px}.intro h1{font-size:64px}.intro p{font-size:14px;max-width:25ch}.gallery{left:22%;top:15%}.tools{left:84%;top:64%}.projects{left:20%;top:87%}.destination{font-size:15px;min-width:75px}.bottom{align-items:start;gap:18px}.socials{gap:15px}.signature{max-width:95px;text-align:right;line-height:1.6}.blue .intro{left:35%;top:44%;width:175px}.blue .intro h1{font-size:62px}.blue .intro p{font-size:13px}.blue .gallery{left:67%;top:15%}.blue .tools{left:85%;top:58%}.blue .projects{left:62%;top:87%}.eclipse{width:245px;height:245px}.rose .gallery{left:17%;top:18%}.rose .tools{left:83%;top:75%}.rose .projects{left:20%;top:88%}.rose .intro h1{font-size:72px}.atlas .intro{top:24%;width:260px}.atlas .intro h1{font-size:64px}.atlas .gallery{left:17%;top:56%}.atlas .tools{left:82%;top:63%}.atlas .projects{left:44%;top:88%}.tidal .intro{left:52%;top:45%;width:190px}.tidal .intro h1{font-size:64px}.tidal .gallery{left:19%;top:16%}.tidal .tools{left:84%;top:72%}.tidal .projects{left:25%;top:89%}}
.phone .scene{padding:22px 18px}.phone .space{height:480px}.phone .intro{width:210px}.phone .intro h1{font-size:64px}.phone .intro p{font-size:14px;max-width:25ch}.phone .gallery{left:22%;top:15%}.phone .tools{left:84%;top:64%}.phone .projects{left:20%;top:87%}.phone .destination{font-size:15px;min-width:75px}.phone .bottom{align-items:start;gap:18px}.phone .socials{gap:15px}.phone .signature{max-width:95px;text-align:right;line-height:1.6}.phone .blue .intro{left:35%;top:44%;width:175px}.phone .blue .intro h1{font-size:62px}.phone .blue .intro p{font-size:13px}.phone .blue .gallery{left:67%;top:15%}.phone .blue .tools{left:85%;top:58%}.phone .blue .projects{left:62%;top:87%}.phone .eclipse{width:245px;height:245px}.phone .rose .gallery{left:17%;top:18%}.phone .rose .tools{left:83%;top:75%}.phone .rose .projects{left:20%;top:88%}.phone .rose .intro h1{font-size:72px}.phone .atlas .intro{top:24%;width:260px}.phone .atlas .gallery{left:17%;top:56%}.phone .atlas .tools{left:82%;top:63%}.phone .atlas .projects{left:44%;top:88%}.phone .tidal .intro{left:52%;top:45%;width:190px}.phone .tidal .gallery{left:19%;top:16%}.phone .tidal .tools{left:84%;top:72%}.phone .tidal .projects{left:25%;top:89%}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="choices" role="group" aria-label="Constellation designs" id="choices"></div>
<div class="details"><div><h2 id="title"></h2><p id="description"></p></div><div class="size" role="group" aria-label="Preview size"><button id="desktop" aria-pressed="true">Full width</button><button id="mobile" aria-pressed="false">Phone</button></div></div>
<div class="frame" id="frame"><section class="scene" id="scene" aria-label="Homepage concept"><header class="top"><a href="https://l3gh.com" target="_blank" rel="noopener" class="wordmark">l3gh</a><span class="where" id="tagline"></span></header><main class="space"><div class="dust" id="dust" aria-hidden="true"></div><div id="decoration" aria-hidden="true"></div><svg class="geometry" id="geometry" viewBox="0 0 700 470" preserveAspectRatio="none" aria-hidden="true"></svg><div class="intro"><h1>Leah</h1><p id="bio"></p></div><nav aria-label="Explore"><a class="destination gallery" href="https://l3gh.com/gallery/" target="_blank" rel="noopener">Gallery</a><a class="destination tools" href="https://l3gh.com/tools/" target="_blank" rel="noopener">Tools</a><a class="destination projects" href="https://l3gh.com/projects/" target="_blank" rel="noopener">Projects<small>Coming soon</small></a></nav></main><footer class="bottom"><div class="socials"><a href="https://github.com/l3gh" target="_blank" rel="noopener">GitHub</a><a href="https://discord.gg/N58BT9AZ" target="_blank" rel="noopener">Discord</a><a href="mailto:_@l3gh.com">Email</a></div><span class="signature">A little place of my own.</span></footer></section></div>
<p class="explain">Provisional copy. Hover or focus a destination to light up its star. Links open the existing site.</p>
<script>
const options=[
{name:'Violet orbits',class:'violet',color:'#b6a0d2',description:'Closest to your favourite: soft violet, crossing orbits, and a quiet centre. Refined rather than reinvented.',tagline:'A small personal universe',bio:'A little space for the things I make, keep, and care about.',svg:'<ellipse cx="350" cy="230" rx="208" ry="140" transform="rotate(-27 350 230)"/><ellipse class="secondary" cx="350" cy="230" rx="235" ry="101" transform="rotate(34 350 230)"/><path class="bright" d="M 160 327 C 194 389 284 401 357 365"/>'},
{name:'Blue hour',class:'blue',color:'#8ebfdb',description:'More open and off-centre. An icy blue observatory with your introduction on the left and destinations sweeping around it.',tagline:'Somewhere between worlds',bio:'Also known as l3gh. Welcome to my corner of the internet.',svg:'<ellipse cx="170" cy="235" rx="330" ry="205"/><ellipse class="secondary" cx="170" cy="235" rx="420" ry="250"/><ellipse class="secondary" cx="170" cy="235" rx="510" ry="290"/><path class="bright" d="M 480 104 C 528 145 551 201 548 249"/>'},
{name:'Rose eclipse',class:'rose',color:'#d5a2bc',description:'A hushed rose-and-plum eclipse. A more intimate centre, with a fine crescent of light and widely spaced destinations.',tagline:'You found me here',bio:'I’m Leah. This is where a few pieces of my world come together.',svg:'<ellipse cx="350" cy="225" rx="270" ry="160" transform="rotate(29 350 225)"/><ellipse class="secondary" cx="350" cy="225" rx="280" ry="95" transform="rotate(-37 350 225)"/>',decoration:'<div class="eclipse"></div>'},
{name:'Star atlas',class:'atlas',color:'#c6cfdf',description:'The orbits become an actual constellation. Silver stars connect the pages below your name, with a clearer, more graphic silhouette.',tagline:'A few points of connection',bio:'A personal collection of pictures, experiments, and things still taking shape.',svg:'<path d="M 140 246 L 242 310 L 392 260 L 539 270 L 466 351 L 343 387 L 242 310"/><path class="secondary" d="M 140 246 L 94 182 M 539 270 L 614 176 M 392 260 L 435 179"/><circle cx="242" cy="310" r="3"/><circle cx="392" cy="260" r="2.5"/><circle cx="466" cy="351" r="3"/><circle cx="94" cy="182" r="2"/><circle cx="614" cy="176" r="2"/><circle cx="435" cy="179" r="2"/>'},
{name:'Tidal space',class:'tidal',color:'#93c8b9',description:'Deep sea-green with loose, flowing paths. Less astronomical precision; more of a strange, quiet world you can wander through.',tagline:'A world a little out of orbit',bio:'I’m Leah, or l3gh. A few things I’ve made. A few things I’ve kept.',svg:'<path d="M -45 210 C 55 30 229 65 384 121 S 646 224 741 72"/><path class="secondary" d="M -20 225 C 78 76 214 115 358 152 S 647 320 735 178"/><path d="M -45 348 C 131 461 195 320 310 333 S 547 449 745 259"/><path class="bright" d="M 385 361 C 499 391 601 356 667 309"/>'}
];
function choose(i){const d=options[i];document.getElementById('scene').className='scene '+d.class;document.getElementById('title').textContent=(i+1)+'. '+d.name;document.getElementById('description').textContent=d.description;document.getElementById('tagline').textContent=d.tagline;document.getElementById('bio').textContent=d.bio;document.getElementById('geometry').innerHTML=d.svg;document.getElementById('decoration').innerHTML=d.decoration||'';document.querySelectorAll('#choices button').forEach((b,n)=>b.setAttribute('aria-pressed',n===i));}
options.forEach((d,i)=>{const b=document.createElement('button');b.innerHTML=`<span class="swatch" style="background:${d.color}"></span>${i+1}. ${d.name}`;b.onclick=()=>choose(i);document.getElementById('choices').append(b)});
for(let i=0;i<34;i++){const star=document.createElement('i');star.style.left=((i*47+11)%99)+'%';star.style.top=((i*i*13+7)%97)+'%';if(i%9===0)star.className='cross';document.getElementById('dust').append(star)}
function size(phone){document.getElementById('frame').classList.toggle('phone',phone);document.getElementById('desktop').setAttribute('aria-pressed',!phone);document.getElementById('mobile').setAttribute('aria-pressed',phone)}document.getElementById('desktop').onclick=()=>size(false);document.getElementById('mobile').onclick=()=>size(true);choose(0);
</script>
</body>
</html>
