<!doctype html><html lang="en"><meta charset="utf-8"><title>Gallery admin</title><h1>Gallery</h1>
<form method="post" action="/admin/upload" enctype="multipart/form-data"><input type="hidden" name="csrf" value="{{csrf}}"><label>Image <input type="file" name="file" accept="image/jpeg,image/png,image/webp" required></label><button>Upload draft</button></form>
{% for item in items %}<article><h2>{{item.id}}</h2><form method="post" action="/admin/item/{{item.id}}"><input type="hidden" name="csrf" value="{{csrf}}">{% for key in ['title','caption','alt','position'] %}<label>{{key}} <input name="{{key}}" value="{{item[key]}}"></label>{% endfor %}<label>Published <input type="checkbox" name="published" value="yes" {% if item.published %}checked{% endif %}></label><button>Save</button><button name="action" value="delete">Delete permanently</button></form></article>{% endfor %}
<form method="post" action="/admin/logout"><input type="hidden" name="csrf" value="{{csrf}}"><button>Log out</button></form></html>
