const designs=[
{name:'Photo journal',color:'#a8c1ce',description:'Cool blue-grey, literary type, and a large photograph. An intimate personal journal with room for a proper introduction.',css:`body{background:#e6edf0;color:#18323c;font-family:Georgia,serif}.wrap{max-width:1060px;margin:auto;padding:30px 6%}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #b8cdd6;padding-bottom:20px}.brand{font-size:27px}.hero{display:grid;grid-template-columns:1fr 1fr;gap:8%;align-items:center;margin:45px 0}h1{font-size:clamp(46px,7vw,80px);font-weight:400;line-height:1.03;margin:16px 0 24px}.hero p{font-size:17px;line-height:1.8}.hero img{width:100%;height:370px;object-fit:cover;border-radius:100px 100px 3px 3px}.caption{font:12px system-ui;color:#476470;margin-top:10px}.bottom{display:flex;justify-content:space-between;gap:20px;border-top:1px solid #b8cdd6;padding-top:20px}nav,.links{font:13px system-ui;display:flex;gap:18px}.note{font:13px system-ui;color:#476470}@media(max-width:550px){header{align-items:flex-start;gap:20px}nav{flex-wrap:wrap;gap:10px}.hero{gap:24px;grid-template-columns:1fr;margin-top:25px}.hero img{height:220px;border-radius:60px 60px 3px 3px}.bottom{flex-direction:column}h1{font-size:52px}}`,html:`<div class="wrap"><header><a class="brand" href="https://l3gh.com">Leah.</a>${nav}</header><main class="hero"><div><h1>A little<br>closer.</h1><p>${intro}</p><p>A collection of things I make, things I like, and whatever catches my attention.</p></div><figure>${img(flowers,'A close view of pink roses')}<figcaption class="caption">A corner of my world.</figcaption></figure></main><footer class="bottom"><div class="links">${socials}</div><span class="note">Projects are coming soon.</span></footer></div>`},
{name:'Cobalt poster',color:'#173de8',description:'A saturated blue canvas and enormous condensed lettering. Direct, graphic, and deliberately loud without adding clutter.',css:`body{background:#173de8;color:#fff;font-family:Arial,sans-serif}.wrap{padding:28px 5%}header{display:flex;justify-content:space-between;align-items:center}nav{display:flex;gap:20px;font-size:13px}.brand{border:1px solid #bbc8ff;border-radius:50%;width:44px;height:44px;display:grid;place-items:center}.poster{position:relative;padding:30px 0 24px}.poster h1{font-family:Impact,'Arial Narrow',sans-serif;font-size:clamp(140px,35vw,340px);line-height:.95;letter-spacing:-.035em;margin:24px 0 0;font-weight:400}.poster p{font-size:20px;max-width:370px;line-height:1.5}.sticker{position:absolute;right:0;bottom:55px;background:#ffda55;color:#173de8;border-radius:50%;width:120px;height:120px;display:grid;place-items:center;text-align:center;transform:rotate(12deg);font-size:17px;font-weight:bold}.bottom{display:flex;justify-content:space-between;align-items:end;border-top:1px solid #bbc8ff;padding-top:20px}.links{display:flex;gap:22px}.bottom small{color:#bbc8ff}@media(max-width:550px){nav{gap:12px;font-size:12px}.poster{padding:50px 0 90px}.poster h1{font-size:39vw}.sticker{width:80px;height:80px;bottom:8px;font-size:13px}.bottom{align-items:start;gap:28px;flex-direction:column}.poster p{font-size:18px}}`,html:`<div class="wrap"><header><a class="brand" href="https://l3gh.com">l3</a>${nav}</header><main class="poster"><h1>LEAH</h1><p>${intro}</p><div class="sticker">Always<br>curious.</div></main><footer class="bottom"><div class="links">${socials}</div><small>New projects? Coming soon.</small></footer></div>`},
{name:'Desktop',color:'#adc2c9',description:'Offset windows, folder navigation, and a personal-computer feel. Playful utility rather than a conventional portfolio landing page.',css:`body{background:#adc2c9;color:#192a36;font-family:'Courier New',monospace}.menu{background:#edf2ef;padding:12px 24px;display:flex;justify-content:space-between;font-size:13px;border-bottom:2px solid #192a36}.desk{max-width:900px;position:relative;margin:auto;padding:45px 30px 80px;min-height:540px}.window{background:#edf2ef;border:2px solid #192a36;box-shadow:7px 7px 0 #3c6380}.titlebar{border-bottom:2px solid #192a36;padding:9px 12px;display:flex;justify-content:space-between;font-size:12px}.about{width:65%;position:relative;z-index:2}.content{padding:26px}.content h1{font-size:44px;margin:0 0 18px;letter-spacing:-3px}.content p{line-height:1.65;font-size:14px}.links{display:flex;gap:14px;font-size:12px;margin-top:26px}.picture{width:33%;position:absolute;right:30px;top:150px;transform:rotate(3deg)}.picture img{width:100%;height:205px;object-fit:cover;display:block}.folders{display:flex;gap:30px;margin-top:30px}.folders a{text-align:center;font-size:12px}.folder{display:block;width:48px;height:34px;background:#e5cd7e;border:2px solid #192a36;border-radius:3px;margin:10px auto;position:relative}.folder:before{content:'';position:absolute;top:-8px;left:-2px;width:22px;height:8px;background:#e5cd7e;border:2px solid #192a36;border-bottom:0}.menu nav{display:flex;gap:18px}@media(max-width:550px){.menu{padding:12px;font-size:11px}.menu nav{gap:10px}.desk{padding:28px 18px}.about{width:100%}.picture{position:relative;width:60%;right:auto;top:auto;margin:26px 0 0 auto}.folders{gap:22px}.content h1{font-size:38px}}`,html:`<header class="menu"><strong>Leah’s computer</strong>${nav}</header><main class="desk"><section class="window about"><div class="titlebar"><span>about-me.txt</span><span>− □ ×</span></div><div class="content"><h1>Hello, stranger.</h1><p>${intro}</p><p>Make yourself at home. Th {name:'Scrapbook',color:'#e9acd0',description:'Rose paper, loosely placed photographs, and a handwritten greeting. Warm and personal, with the feeling of a page assembled by hand.',css:`body{background:#f5deed;color:#562b49;font-family:Georgia,serif}.wrap{max-width:960px;margin:auto;padding:26px 5%}header{display:flex;justify-content:space-between;gap:20px;align-items:center}.brand{font-style:italic;font-size:30px}nav{display:flex;gap:18px;font:13px Arial}.scraps{display:grid;grid-template-columns:1fr 1.4fr;gap:40px;align-items:center;margin:45px 0}.polaroid{padding:12px 12px 35px;background:#fffafa;box-shadow:0 6px 16px #562b4922;transform:rotate(-6deg);position:relative}.polaroid:before{content:'';position:absolute;top:-10px;left:35%;width:80px;height:24px;background:#cdb6d6aa;transform:rotate(8deg)}.polaroid img{width:100%;height:240px;object-fit:cover;display:block}.polaroid figcaption{font-style:italic;text-align:center;margin-top:12px}.note h1{font-family:'Segoe Print','Comic Sans MS',cursive;font-weight:400;font-size:52px;line-height:1.2;margin:0 0 20px}.note p{line-height:1.8;font-size:17px}.links{display:flex;gap:20px;font:14px Arial;margin-top:30px}.postscript{padding:22px;background:#fffafa;max-width:320px;margin:15px 0 0 auto;transform:rotate(2deg);font-size:15px;line-height:1.7;border-radius:2px}.postscript p{margin:0}@media(max-width:550px){header{align-items:start}nav{flex-wrap:wrap;gap:10px}.scraps{grid-template-columns:1fr;gap:35px;margin:35px 0}.polaroid{max-width:240px;justify-self:center}.polaroid img{height:150px}.note h1{font-size:43px}.postscript{margin-bottom:20px}}`,html:`<div class="wrap"><header><a class="brand" href="https://l3gh.com">leah’s place</a>${nav}</header><main><div class="scraps"><figure class="polaroid">${img(portrait,'Leah’s profile image')}<figcaption>me, somewhere online</figcaption></figure><section class="note"><h1>Oh, hi there ♡</h1><p>${intro}</p><p>Pictures, little experiments, and things I want to keep. A page that feels like me.</p><div class="links">${socials}</div></section></div><aside class="postscript"><p>A note to visitors:<br>the projects page is getting a fresh start. More soon.</p></aside></main></div>`},
{name:'Quiet page',color:'#d6d1e6',description:'A calm, text-first introduction with generous spacing and a small portrait. Understated, readable, and focused on your own words.',css:`body{background:#fbfbfd;color:#34323f;font-family:Palatino,'Palatino Linotype',Georgia,serif}.wrap{max-width:700px;margin:auto;padding:32px 7% 45px}header{display:flex;justify-content:space-between;gap:20px;align-items:center;font:13px Arial}.brand{font-family:Georgia;font-size:25px}nav{display:flex;gap:18px}main{margin-top:62px}.portrait{width:68px;height:68px;border-radius:50%;object-fit:cover}h1{font-size:45px;font-weight:400;letter-spacing:-1px;margin:20px 0}main p{font-size:20px;line-height:1.8;max-width:48ch}.browse{margin-top:30px;padding-top:12px}.browse a{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0;border-bottom:1px solid #e5e2ec;color:#67538e}.browse span{font:12px Arial;color:#797487}.links{display:flex;gap:22px;font:13px Arial;margin-top:35px}@media(max-width:550px){.wrap{padding:24px}header{align-items:start}nav{gap:12px;flex-wrap:wrap}main{margin-top:35px}main p{font-size:18px}h1{font-size:39px}}`,html:`<div class="wrap"><header><a class="brand" href="https://l3gh.com">l3gh</a>${nav}</header><main>${img(portrait,'Leah’s profile image','portrait')}<h1>Hello, I’m Leah.</h1><p>This is my little place on the internet. Somewhere to share what I’m making, save a few pictures, and stay curious.</p><div class="browse"><a href="https://l3gh.com/gallery/">A few things I’ve kept <span>Gallery</span></a><a href="https://l3gh.com/tools/">Small, useful experiments <span>Tools</span></a><a href="https://l3gh.com/projects/">Something for later <span>Coming soon</span></a></div></main><footer class="links">${socials}</footer></div>`},
{name:'Pixel world',color:'#39576c',description:'A dusk-blue landscape with hard-edged pixel scenery. A gaming-adjacent personal site that still gives the introduction room to breathe.',css:`body{background:#192d45;color:#e4f6d9;font-family:'Courier New',monospace}.wrap{max-width:1000px;margin:auto;padding:25px 5%}header{display:flex;justify-content:space-between;align-items:center;gap:20px}nav{display:flex;gap:20px;font-size:13px}.brand{font-weight:bold;font-size:23px;color:#fac67c}main{text-align:center;margin:65px 0 0}h1{font-size:clamp(34px,6vw,60px);letter-spacing:-2px;margin:0 0 20px}main p{max-width:460px;margin:0 auto;line-height:1.8;font-size:15px}.links{display:flex;justify-content:center;gap:25px;margin-top:30px;font-size:13px;color:#fac67c}.land{height:205px;position:relative;margin:35px -5.6% -1px;overflow:hidden}.moon{position:absolute;width:44px;height:44px;background:#fac67c;right:18%;top:20px;box-shadow:10px 0 #192d45}.mount{position:absolute;bottom:0;background:#39576c;clip-path:polygon(0 100%,0 60%,15% 60%,15% 40%,28% 40%,28% 20%,40% 20%,40% 0,56% 0,56% 30%,70% 30%,70% 50%,85% 50%,85% 70%,100% 70%,100% 100%);width:70%;height:140px;left:0}.mount.two{left:45%;bottom:-35px;background:#6b8b85;height:160px}.ground{position:absolute;bottom:0;background:#b4c9a3;width:100%;height:18px;border-top:6px solid #e4f6d9}footer{background:#e4f6d9;color:#192d45;padding:20px;text-align:center;font-size:12px}@media(max-width:550px){nav{gap:10px;font-size:11px}main{margin-top:65px}.land{height:180px}h1{font-size:35px}}`,html:`<div class="wrap"><header><a class="brand" href="https://l3gh.com">l3gh_</a>${nav}</header><main><h1>You found my world.</h1><p>${intro}<br>Have a look around. Stay a while.</p><div class="links">${socials}</div></main><div class="land" aria-hidden="true"><div class="moon"></div><div class="mount"></div><div class="mount two"></div><div class="ground"></div></div></div><footer>New adventures in the making. Projects coming soon.</footer>`},
{name:'Gallery wall',color:'#aab69f',description:'An image-led home with a compact introduction in the margin. Best if the renewed gallery should become the centre of the site.',css:`body{background:#eceae5;color:#242c26;font-family:'Trebuchet MS',sans-serif}.wrap{max-width:1100px;margin:auto;padding:30px 5%}header{display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-size:26px;letter-spacing:-1px}nav{display:flex;gap:20px;font-size:13px}.wall{display:grid;grid-template-columns:.8fr 1.3fr 1fr;gap:20px;margin-top:45px;align-items:start}.intro h1{font:36px Georgia;margin:0 0 20px}.intro p{font-size:14px;line-height:1.8}.links{display:flex;flex-direction:column;gap:12px;font-size:13px;margin-top:25px}.wall figure{margin:0}.wall img{width:100%;object-fit:cover;display:block}.large img{height:350px}.small img{height:175px}.small{padding-top:55px}.wall figcaption{font-size:11px;margin:12px 0;color:#687568}.detail{margin-top:25px!important}.detail img{height:140px}footer{margin-top:25px;font-size:12px;color:#687568}@media(max-width:550px){nav{gap:10px;font-size:12px}.wall{grid-template-columns:1fr 1fr;gap:15px;margin-top:30px}.intro{grid-column:1/-1}.intro h1{margin-bottom:10px}.links{flex-direction:row;margin:15px 0}.large img{height:260px}.small{padding-top:35px}.small img{height:120px}.detail img{height:90px}}`,html:`<div class="wrap"><header><a class="brand" href="https://l3gh.com">Leah’s collection</a>${nav}</header><main class="wall"><section class="intro"><h1>Things<br>I’m drawn to.</h1><p>${intro}</p><p>Some images, some experiments, a few pieces of everyday life.</p><div class="links">${socials}</div></section><figure class="large">${img(flowers,'Pink roses')}<figcaption>Colour, up close.</figcaption></figure><div class="small"><figure>${img(photo,'A desk setup')}<figcaption>A place to make things.</figcaption></figure><figure class="detail">${img(landscape,'A Minecraft build')}<figcaption>Other worlds.</figcaption></figure></div></mai {name:'Constellation',color:'#a49bcc',description:'An aubergine night sky with destinations arranged around your name. Dreamy and exploratory, with the navigation as the main visual.',css:`body{background:#202039;color:#f3efff;font-family:Georgia,serif}.wrap{max-width:1000px;margin:auto;padding:25px 5%}header{display:flex;justify-content:space-between;font:13px Arial;color:#bdb5d4}.universe{position:relative;height:440px;display:grid;place-items:center}.orbit{position:absolute;width:370px;height:310px;border:1px solid #70658b;border-radius:50%;transform:rotate(-22deg)}.orbit:after{content:'';position:absolute;inset:40px -65px;border:1px solid #534966;border-radius:50%;transform:rotate(54deg)}.center{z-index:1;text-align:center;max-width:270px}.center h1{font-size:76px;font-weight:400;line-height:1;margin:0 0 15px}.center p{line-height:1.6;font-size:15px;color:#c9c1df}.planet{position:absolute;z-index:2;background:#202039;padding:12px;font-size:17px}.planet:before{content:'';display:block;width:10px;height:10px;background:#dcbaed;border-radius:50%;margin:0 auto 8px;box-shadow:0 0 0 5px #dcbaed12}.gallery{top:44px;left:27%}.tools{right:12%;top:185px}.projects{left:12%;bottom:40px}.projects small{display:block;color:#a9a1c5;font:11px Arial;margin-top:6px}.links{display:flex;justify-content:center;gap:25px;font:13px Arial}footer{text-align:center;color:#a9a1c5;font:12px Arial;margin-top:30px}@media(max-width:550px){.universe{height:490px}.orbit{width:240px;height:320px}.orbit:after{inset:55px -25px}.center{max-width:205px}.center h1{font-size:64px}.center p{font-size:14px}.gallery{left:12%;top:35px}.tools{right:0;top:235px}.projects{left:0;bottom:25px}.planet{font-size:15px}}`,html:`<div class="wrap"><header><a href="https://l3gh.com">l3gh.com</a><span>A small personal universe</span></header><main class="universe"><div class="orbit" aria-hidden="true"></div><div class="center"><h1>Leah</h1><p>A little space for the things I make, keep, and care about.</p></div><a class="planet gallery" href="https://l3gh.com/gallery/">Gallery</a><a class="planet tools" href="https://l3gh.com/tools/">Tools</a><a class="planet projects" href="https://l3gh.com/projects/">Projects<small>Coming soon</small></a></main><div class="links">${socials}</div><footer>You might know me as l3gh.</footer></div>`},

g new.</h2><p>I’m starting fresh with the projects section. Come back for a look when it’s ready.</p></div>${img(flowers,'A small study of roses')}</section><footer class="links">${socials}</footer></main></div>`}

const base=`*{box-sizing:border-box}body{margin:0}a{color:inherit;text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:4px}a:focus-visible{outline:3px solid currentColor;outline-offset:5px}figure{margin:0}img{max-width:100%}nav{line-height:1.5}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}`;
function choose(index){const d=designs[index];document.querySelectorAll('#chooser button').forEach((b,i)=>b.setAttribute('aria-pressed',i===index));document.getElementById('name').textContent=`${index+1}. ${d.name}`;document.getElementById('description').textContent=d.description;document.getElementById('preview').title=d.name+' homepage concept';document.getElementById('preview').srcdoc=`<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base target="_blank"><style>${base}${d.css}</style></head><body>${d.html}</body></html>`;}
designs.forEach((d,i)=>{const b=document.createElement('button');b.innerHTML=`<span class="swatch" style="background:${d.color}"></span>${i+1}. ${d.name}`;b.onclick=()=>choose(i);document.getElementById('chooser').append(b)});
function size(phone){document.getElementById('frame').classList.toggle('phone',phone);document.getElementById('wide').setAttribute('aria-pressed',!phone);document.getElementById('narrow').setAttribute('aria-pressed',phone)}document.getElementById('wide').onclick=()=>size(false);document.getElementById('narrow').onclick=()=>size(true);choose(0);
